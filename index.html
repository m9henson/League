<body>
<div class="app">
  <div class="top">
    <div class="title">
      <h1>Tuesday League 2026</h1>
      <p>Teams are alphabetical by first teammate. Search by either name, then enter scores as usual.</p>
    </div>
    <div class="actions">
      <button id="authBtn" type="button">Admin Sign In</button>
      <button id="sortBtn" type="button">Rank by Avg</button>
      <button id="addTeamBtn" type="button">+ Team</button>
      <button id="addWeekBtn" class="primary" type="button">+ Week</button>
    </div>
  </div>
  <div id="deviceNote" class="sheet-note">Cloud scores are live. Use Admin Sign In only when you need to enter or change scores.</div>
  <div class="search-row">
    <input id="teamSearch" class="search-box" type="search" autocomplete="off" placeholder="Search teammate name…" aria-label="Search teams by teammate name">
  </div>
  <div class="statusbar">
    <span id="summary"></span>
    <span class="save"><span class="dot"></span><span id="saveText">Saved</span></span>
  </div>
  <div class="table-wrap" id="tableWrap">
    <table id="leagueTable" aria-label="Tuesday League stableford scores"></table>
  </div>
</div>

<div id="dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog">
    <h2 id="dialogTitle">Add Team</h2>
    <label for="teamName">Team / Pair</label>
    <input id="teamName" type="text" autocomplete="off" placeholder="Henson / Williams">
    <div class="dialog-actions">
      <button id="cancelTeam" type="button">Cancel</button>
      <button id="saveTeam" class="primary" type="button">Add Team</button>
    </div>
  </div>
</div>

<div id="authDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="authDialogTitle">
  <div class="dialog">
    <h2 id="authDialogTitle">Admin Sign In</h2>
    <label for="adminUsername">Username</label>
    <input id="adminUsername" type="text" autocomplete="username" value="admin" autocapitalize="none" spellcheck="false">
    <label for="adminPassword" style="margin-top:12px">Password</label>
    <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Admin password">
    <div id="authError" class="danger" style="min-height:20px;margin-top:8px;font-size:.86rem"></div>
    <div class="dialog-actions">
      <button id="cancelAuth" type="button">Cancel</button>
      <button id="loginAdmin" class="primary" type="button">Sign In</button>

  </div>
</div>

function deepCopy(v){return JSON.parse(JSON.stringify(v));}
function configIsFilled(){return !Object.values(firebaseConfig).some(v=>String(v).startsWith('PASTE_'));}
function loadLocalState(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY) || localStorage.getItem('tuesdayLeague2026_simple_v1');
    if(saved){const parsed=JSON.parse(saved);if(parsed && Array.isArray(parsed.teams) && Array.isArray(parsed.weeks)) return parsed;}
  }catch(e){}
  return deepCopy(INITIAL_DATA);
}
function saveLocalBackup(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}

function sanitizeCloudState(data){
  if(!data || !Array.isArray(data.teams) || !Array.isArray(data.weeks)) return null;
  return {season:Number(data.season)||2026,weeks:data.weeks,teams:data.teams};
}
function saveState(){
  saveLocalBackup();
  if(!firebaseReady){setSaveText('Saved locally');return Promise.resolve();}
  if(!isAdmin){setSaveText('View only');return Promise.resolve();}

  // no debounce/timer here, so pausing between digits can never trigger a save.
  const payload=deepCopy(state);

}
function numericScores(team){return team.scores.filter(v=>typeof v==='number' && Number.isFinite(v));}

function soloAverage(team){const a=numericScores(team);return a.length>3?average(team)*0.80:null;}
function formatAvg(v){return v==null?'—':v.toFixed(2);}
function currentWeekIndex(){return Math.max(0,state.weeks.length-1);}
function displayWeekOrder(){const cur=currentWeekIndex();const order=[cur];for(let i=cur-1;i>=0;i--) order.push(i);return order;}
function firstTeammateName(teamName){

function orderedTeams(){
  const q=searchTerm.trim().toLowerCase();
  const rows=state.teams
    .map((t,i)=>({team:t,index:i,avg:average(t),played:numericScores(t).length}))
    .filter(r=>!q || r.team.name.toLowerCase().includes(q));

    rows.sort((x,y)=>(y.avg??-Infinity)-(x.avg??-Infinity)||firstTeammateName(x.team.name).localeCompare(firstTeammateName(y.team.name),undefined,{sensitivity:'base'})||x.index-y.index);
  }else{
    rows.sort((x,y)=>firstTeammateName(x.team.name).localeCompare(firstTeammateName(y.team.name),undefined,{sensitivity:'base'})||x.team.name.localeCompare(y.team.name,undefined,{sensitivity:'base'})||x.index-y.index);
  }
  return rows;
}

function render(){

  rows.forEach((r,rank)=>{

    html+=`<tr><td class="team" title="${escapeAttr(r.team.name)}"><span class="rank">${sortMode==='average'?(rank+1)+'.':''}</span>${escapeHtml(r.team.name)}</td><td class="avg">${formatAvg(avg)}<small>${played} played</small></td><td class="solo">${formatAvg(solo)}<small>${played>3?'80% of Avg':'4 rounds needed'}</small></td>`;

  if(inp.readOnly)return false;
  const parsed=parseScore(inp.value);
  if(parsed===undefined){inp.style.boxShadow='inset 0 0 0 2px #a33b32';return false;}
  inp.style.boxShadow='';
  const ti=Number(inp.dataset.team),wi=Number(inp.dataset.week);
  state.teams[ti].scores[wi]=parsed;
  const row=inp.closest('tr'),avgCell=row.querySelector('.avg'),soloCell=row.querySelector('.solo');
  const a=average(state.teams[ti]),s=soloAverage(state.teams[ti]),played=numericScores(state.teams[ti]).length;
  avgCell.innerHTML=`${formatAvg(a)}<small>${played} played</small>`;
  soloCell.innerHTML=`${formatAvg(s)}<small>${played>3?'80% of Avg':'4 rounds needed'}</small>`;
  saveState();
  return true;
}
function moveScoreFocus(inp,direction){
  const wi=inp.dataset.week;
  const columnInputs=Array.from(document.querySelectorAll(`.score[data-week="${wi}"]`));
  const p=columnInputs.indexOf(inp),target=columnInputs[p+direction];
  if(target){target.focus();target.select();target.scrollIntoView({block:'nearest',inline:'nearest'});}
}
function bindScoreInputs(){
  document.querySelectorAll('.score').forEach(inp=>{
    inp.addEventListener('focus',()=>{
      if(inp.readOnly)return;
      scoreEntryActive=true;
      inp.select();
    });
    // Typing only changes the input element. No save, no timer, and no render.
    inp.addEventListener('input',()=>{
      if(inp.readOnly)return;
      const parsed=parseScore(inp.value);
      inp.style.boxShadow=parsed===undefined?'inset 0 0 0 2px #a33b32':'';
    });
    inp.addEventListener('blur',()=>{
      if(!inp.readOnly) commitScoreInput(inp);
      // Let focus settle first. Moving to another score cell keeps entry mode active.
      setTimeout(()=>{
        const active=document.activeElement;
        scoreEntryActive=!!(active&&active.classList&&active.classList.contains('score'));
        if(!scoreEntryActive) render();
      },0);
    });
    inp.addEventListener('keydown',e=>{
      if(inp.readOnly)return;
      if(e.key==='Enter'){
        e.preventDefault();
        if(commitScoreInput(inp)) moveScoreFocus(inp,1);
      }
      if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!e.shiftKey){
        e.preventDefault();
        if(commitScoreInput(inp)) moveScoreFocus(inp,e.key==='ArrowDown'?1:-1);
      }
    });
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function escapeAttr(s){return escapeHtml(s);}

document.getElementById('sortBtn').addEventListener('click',()=>{sortMode=sortMode==='alpha'?'average':'alpha';render();});
const teamSearch=document.getElementById('teamSearch');
teamSearch.addEventListener('input',()=>{searchTerm=teamSearch.value;render();teamSearch.focus();});
document.getElementById('addWeekBtn').addEventListener('click',()=>{if(firebaseReady&&!isAdmin)return;const n=state.weeks.length+1;state.weeks.push(`Wk ${n}`);state.teams.forEach(t=>t.scores.push(null));sortMode='alpha';saveState();render();setTimeout(()=>{const first=document.querySelector(`.score[data-week="${currentWeekIndex()}"]`);if(first){first.focus();first.select();}},0);});
const dialog=document.getElementById('dialog'),teamName=document.getElementById('teamName');
function closeDialog(){dialog.classList.remove('show');teamName.value='';}
document.getElementById('addTeamBtn').addEventListener('click',()=>{if(firebaseReady&&!isAdmin)return;dialog.classList.add('show');setTimeout(()=>teamName.focus(),0);});
document.getElementById('cancelTeam').addEventListener('click',closeDialog);dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog();});document.getElementById('saveTeam').addEventListener('click',addTeam);teamName.addEventListener('keydown',e=>{if(e.key==='Enter')addTeam();if(e.key==='Escape')closeDialog();});
function addTeam(){const name=teamName.value.trim();if(!name||firebaseReady&&!isAdmin)return;state.teams.push({name,scores:Array(state.weeks.length).fill(null)});saveState();closeDialog();render();}

const authBtn=document.getElementById('authBtn');
const authDialog=document.getElementById('authDialog');
const adminUsername=document.getElementById('adminUsername');
const adminPassword=document.getElementById('adminPassword');
const authError=document.getElementById('authError');

function openAuthDialog(){
  authError.textContent='';
  adminUsername.value=ADMIN_USERNAME;
  adminPassword.value='';
  authDialog.classList.add('show');
  setTimeout(()=>adminPassword.focus(),0);
}
function closeAuthDialog(){authDialog.classList.remove('show');authError.textContent='';adminPassword.value='';}

authBtn.addEventListener('click',async()=>{
  if(!firebaseReady){updateNote('Firebase is not connected yet.');return;}
  if(currentUser){
    try{await signOut(auth);}catch(e){console.error(e);updateNote(`Sign-out problem: ${e.message}`);}
  }else openAuthDialog();
});

document.getElementById('cancelAuth').addEventListener('click',closeAuthDialog);
authDialog.addEventListener('click',e=>{if(e.target===authDialog)closeAuthDialog();});
document.getElementById('loginAdmin').addEventListener('click',loginAdmin);
adminPassword.addEventListener('keydown',e=>{if(e.key==='Enter')loginAdmin();if(e.key==='Escape')closeAuthDialog();});
adminUsername.addEventListener('keydown',e=>{if(e.key==='Enter')adminPassword.focus();if(e.key==='Escape')closeAuthDialog();});

async function loginAdmin(){
  const username=adminUsername.value.trim().toLowerCase();
  const password=adminPassword.value;
  authError.textContent='';
  if(username!==ADMIN_USERNAME){authError.textContent='Incorrect username or password.';return;}
  if(!password){authError.textContent='Enter the admin password.';return;}
  try{
    document.getElementById('loginAdmin').disabled=true;
    await signInWithEmailAndPassword(auth,ADMIN_EMAIL,password);
    closeAuthDialog();
  }catch(e){
    console.error(e);
    authError.textContent='Incorrect username or password.';
  }finally{document.getElementById('loginAdmin').disabled=false;}
}

async function startFirebase(){
  if(!configIsFilled()){firebaseReady=false;setSaveText('Local setup mode');updateNote('Firebase Web app config is missing from index.html.');render();return;}
  try{
    const app=initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);leagueRef=doc(db,'leagues',LEAGUE_DOC_ID);firebaseReady=true;
    onAuthStateChanged(auth,async user=>{
      currentUser=user;isAdmin=!!(user&&String(user.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase());authBtn.textContent=user?'Admin Logout':'Admin Sign In';
      if(user&&!isAdmin) updateNote('This signed-in account is not the league admin.');
      else if(isAdmin) updateNote('Admin mode is active. Changes save to Firebase automatically.',false);
      else updateNote('Cloud scores are live. Sign in as admin only when you need to edit.',false);
      render();
      if(isAdmin&&cloudLoaded===false) setSaveText('Connecting…');
      if(isAdmin&&cloudLoaded&&!cloudDocExists){
        state=deepCopy(INITIAL_DATA);saveLocalBackup();
        try{await setDoc(leagueRef,{...state,updatedAt:serverTimestamp()},{merge:false});setSaveText('Cloud initialized');}
        catch(e){console.error(e);setSaveText('Cloud init failed');updateNote('Signed in, but Firebase blocked the first upload. Check that your Firestore rules are published.');}
      }
    });
    unsubscribeLeague=onSnapshot(leagueRef,async snap=>{
      cloudLoaded=true;cloudDocExists=snap.exists();
      if(snap.exists()){const cloud=sanitizeCloudState(snap.data());if(cloud){if(isAdmin&&scoreEntryActive){setSaveText('Editing');return;}state=cloud;saveLocalBackup();setSaveText(isAdmin?'Cloud synced':'Live');render();}}
      else if(isAdmin){state=deepCopy(INITIAL_DATA);saveLocalBackup();await setDoc(leagueRef,{...state,updatedAt:serverTimestamp()},{merge:false});setSaveText('Cloud initialized');}
      else{setSaveText('Cloud empty');updateNote('The Firebase database is connected but has not been initialized yet. Sign in as admin once to upload the current league data.');render();}
    },err=>{console.error(err);setSaveText('Cloud blocked');updateNote('Firebase connected, but Firestore denied access. Check that the Firestore database exists and your rules are published.');render();});
  }catch(e){console.error(e);firebaseReady=false;setSaveText('Firebase error');updateNote(`Firebase setup error: ${e.message}`);render();}
}

render();
startFirebase();
</script>
